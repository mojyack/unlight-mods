<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; min-width: 210px; background: #1b1420; color: #eee; }
      h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .5px; }
      .row { display: flex; gap: 6px; }
      button { flex: 1; padding: 9px 0; border: 1px solid #4a4a5a; border-radius: 6px; background: #2a2233; color: #eee; cursor: pointer; font-size: 14px; }
      button:hover { border-color: #b48ad6; }
      button.sel { background: #5a3d7a; border-color: #b48ad6; font-weight: bold; }
      .hint { font-size: 11px; color: #aaa; margin-top: 10px; min-height: 14px; }
      h2 { font-size: 11px; font-weight: normal; color: #b48ad6; margin: 14px 0 6px; letter-spacing: .5px; }
    </style>
  </head>
  <body>
    <h1>UNLIGHT speed</h1>
    <div class="row" id="btns"></div>
    <div class="hint" id="hint"></div>
    <h2>RENDER FRAME RATE</h2>
    <div class="row" id="fps"></div>
    <div class="hint" id="fpshint"></div>
    <script src="popup.js"></script>
  </body>
</html>

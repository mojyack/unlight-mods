<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; min-width: 250px; background: #1b1420; color: #eee; }
      h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .5px; }
      button { width: 100%; padding: 9px 0; border: 1px solid #4a4a5a; border-radius: 6px; background: #2a2233; color: #eee; cursor: pointer; font-size: 14px; }
      button:hover { border-color: #b48ad6; }
      button.on { background: #5a3d7a; border-color: #b48ad6; font-weight: bold; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
      td { padding: 2px 0; vertical-align: top; }
      td.k { color: #b48ad6; white-space: nowrap; padding-right: 10px; font-family: ui-monospace, monospace; }
      .sec { color: #888; font-size: 11px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>UNLIGHT key shortcuts</h1>
    <button id="toggle"></button>
    <div class="sec">Card select</div>
    <table>
      <tr><td class="k">Tab</td><td>switch hand / commited</td></tr>
      <tr><td class="k">&#8592; &#8594;</td><td>move cursor</td></tr>
      <tr><td class="k">1 &ndash; 9</td><td>jump to n-th card in the row</td></tr>
      <tr><td class="k">Q / E</td><td>hand page left / right</td></tr>
      <tr><td class="k">&#8593; / Space</td><td>commit / uncommit card</td></tr>
      <tr><td class="k">&#8595;</td><td>flip card</td></tr>
      <tr><td class="k">Enter</td><td>OK (next phase)</td></tr>
    </table>
    <div class="sec">Move phase &mdash; same order as the buttons</div>
    <table>
      <tr><td class="k">Z</td><td>move backward</td></tr>
      <tr><td class="k">X</td><td>wait</td></tr>
      <tr><td class="k">C</td><td>change</td></tr>
      <tr><td class="k">V</td><td>move forward</td></tr>
    </table>
    <script src="popup.js"></script>
  </body>
</html>
